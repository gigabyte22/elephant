services:
  neo4j:
    # 5.26 ships native VECTOR + queryNodes which is all the schema needs.
    # Override with NEO4J_IMAGE_TAG=neo4j:2026-community (or 2026.x) when desired.
    image: ${NEO4J_IMAGE_TAG:-neo4j:5.26-community}
    container_name: elephant-neo4j
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    # Loopback only: the service and the backup script reach Neo4j from this
    # host. Publishing on all interfaces would expose the graph to the network.
    ports:
      - '127.0.0.1:7474:7474'
      - '127.0.0.1:7687:7687'
    environment:
      # No default password: compose refuses to start until one is set (in .env
      # or the environment), so a fresh install never runs on a known secret.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*,gds.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*,gds.*,db.*'
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://localhost:7474 >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12

  # The service itself, opt-in: `docker compose --profile app up -d`. The
  # systemd units run it from the checkout instead and only start `neo4j`.
  elephant:
    profiles: ['app']
    build: .
    container_name: elephant
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - '127.0.0.1:${MEMORY_PORT:-18790}:${MEMORY_PORT:-18790}'
    volumes:
      - elephant-data:/data
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  elephant-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
