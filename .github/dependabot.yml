version: 2
updates:
  # Workspace root — pnpm resolves every package from the one lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the runtime, and package.json pins engines to node
      # >=22. Types several majors ahead describe APIs we don't have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # One PR per week for the routine churn; majors still come in alone.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          # For a 0.x package a semver-minor bump is breaking by convention, so
          # grouping it as routine churn is misleading. Let it arrive alone.
          - '@anthropic-ai/sdk'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /adapters/hermes
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
