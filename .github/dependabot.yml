version: 2
updates:
  # Workspace root — pnpm resolves every package from the one lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for the routine churn; majors still come in alone.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /adapters/hermes
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
