name: Bug report
description: Something in Elephant behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do **not** belong here — please report them privately
        via the [Security tab](https://github.com/gigabyte22/elephant/security/advisories/new).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest sequence that shows it — a `curl` against a local instance,
        a failing test, or the script you ran.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - HTTP API
        - Retrieval / recall
        - Dreaming / consolidation
        - Schema / migrations
        - Dashboard
        - Adapters (MCP, OpenClaw, Hermes)
        - OKF vault
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit SHA you are running (`git rev-parse --short HEAD`).
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: >
        Node version, how Neo4j is running (docker compose / managed / Aura),
        and any non-default configuration that matters — LLM and embedding
        providers, scope mode, feature flags. **Redact API keys and tokens.**
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant service output. Redact secrets and memory content you can't share.
      render: shell
