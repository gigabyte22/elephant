name: Dependabot auto-merge

# Patch bumps merge themselves once CI is green. Minor and major updates still
# wait for a human — a 0.x "minor" is a breaking change by convention, and this
# repo has several 0.x dependencies.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Reads the update metadata from the PR — it never checks out the PR's
      # code, which is what makes pull_request_target safe here.
      - name: fetch metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --auto queues the merge; the ruleset still requires both CI checks to
      # pass, so a failing patch bump sits there instead of landing.
      - name: enable auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
