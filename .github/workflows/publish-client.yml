name: Publish client

# Publishes packages/client to npm when a `client-v<version>` tag is pushed.
# The tag must match packages/client/package.json. Needs the NPM_TOKEN secret
# (an npm automation token with publish rights on the @gigabyte22 scope).
on:
  push:
    tags: ['client-v*']

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: tag matches package version
        run: |
          version=$(node -p "require('./packages/client/package.json').version")
          if [ "client-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/client version $version" >&2
            exit 1
          fi

      - name: typecheck
        run: pnpm --filter @gigabyte22/elephant-client typecheck

      - name: test
        run: pnpm --filter @gigabyte22/elephant-client test

      # pnpm, not npm: publishConfig swaps the workspace's src/ entry points for
      # dist/ in the published manifest, and only pnpm applies it. prepack runs
      # the build.
      - name: publish
        run: pnpm --filter @gigabyte22/elephant-client publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
