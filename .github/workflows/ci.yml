name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: .env.example matches the env schema
        run: pnpm gen:env-example --check

      - name: unit tests
        run: pnpm test

      # The client and the TypeScript adapters are workspace packages with their
      # own vitest configs; the root `pnpm test` only covers tests/unit.
      - name: package tests
        run: pnpm --filter './packages/*' --filter './adapters/*' test

      - name: package typecheck
        run: pnpm --filter './packages/*' --filter './adapters/*' typecheck

      # The dashboard is served from web/dist, so a broken build breaks `pnpm serve`.
      - name: build dashboard
        run: pnpm --filter @elephant/web build

      # The npm tarball for packages/client; a broken build would only surface
      # at release time otherwise.
      - name: pack client
        run: pnpm --filter @kainappsinc/elephant-client pack --pack-destination "$RUNNER_TEMP"

  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/hermes
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Live tests skip themselves unless an Elephant instance is reachable.
      - name: hermes adapter tests
        run: uv run --with pytest pytest -q

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The dashboard specs serve web/dist.
      - name: build dashboard
        run: pnpm --filter @elephant/web build

      # Starts a throwaway Neo4j testcontainer (the runner has Docker); see
      # tests/integration/setup.ts.
      - name: integration tests
        run: pnpm test:integration
