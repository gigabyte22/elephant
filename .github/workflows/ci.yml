name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests
        run: pnpm test

      # The dashboard is served from web/dist, so a broken build breaks `pnpm serve`.
      - name: build dashboard
        run: pnpm --filter @elephant/web build

  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/hermes
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Live tests skip themselves unless an Elephant instance is reachable.
      - name: hermes adapter tests
        run: uv run --with pytest pytest -q
