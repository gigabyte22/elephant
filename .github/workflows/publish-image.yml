name: Publish image

# Builds the root Dockerfile for amd64 + arm64 and pushes it to
# ghcr.io/<owner>/elephant when a `v<version>` tag is pushed. The tag must match
# the root package.json version. Client releases use `client-v*` tags and are
# handled by publish-client.yml.
#
# A manual run (workflow_dispatch) builds both platforms without pushing, as a
# smoke test of the Dockerfile.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: tag matches package version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # GHCR image names must be lowercase; the owner name need not be.
      - name: image name
        id: image
        run: echo "name=ghcr.io/${OWNER,,}/elephant" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,enable=${{ github.event_name != 'push' }}
          labels: |
            org.opencontainers.image.title=elephant
            org.opencontainers.image.description=Neo4j-backed long-term memory service for agent orchestrators

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
